# Netlify Configuration
[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = ".netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# For testing branch: remove cached functions before build to avoid stale Lambda bundles
[context]
  [context.testing]
    # Clear any existing compiled functions then run the normal build
    command = "rm -rf .netlify/functions && npm run build"

    [[context.testing.headers]]
    for = "/_next/static/*"

      [context.testing.headers.values]
      Cache-Control = "public, max-age=31536000, immutable"
